version = 1
SPDX-PackageName = "maven-parent"
SPDX-PackageSupplier = "Sebastian Hoß <seb@xn--ho-hia.de>"
SPDX-PackageDownloadLocation = "https://github.com/metio/maven-parent"

# JSON carries no comment syntax; flake.lock is nix-generated JSON and
# renovate.json follows Renovate's fixed schema.
[[annotations]]
path = ["renovate.json", "flake.lock"]
precedence = "override"
