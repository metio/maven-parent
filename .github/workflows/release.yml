name: Release
on:
  schedule:
    - cron: 23 4 1 * *
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: metio/ci/.github/workflows/maven-central-release.yml@f6c5da232253f67486721f46cf4cd5d488189e04 # 2026.10.31224636
    with:
      paths: pom.xml
    secrets: inherit
