name: Release

# Calendar-versioned release to Maven Central, on this repo's monthly slot (the
# 1st — the parent POM releases before the projects that inherit it, so their
# own slots later in the month already see it). Two gates guard the deploy: the
# POM must have changed since the last release, and the organization's shared
# Maven Central budget must have room. A skipped month costs nothing and loses
# nothing — the gate measures against the last release, not the last run, so the
# pending changes ride the next slot.
on:
  schedule:
    - cron: 15 1 1 * *
  workflow_dispatch:

permissions:
  contents: write # create the tag and the release

# Serialize runs: needs-release reads the previous tag before this run creates
# its own, so two runs in flight would emit overlapping notes. Queue (never
# cancel) so the earlier run tags first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gate:
    # Both questions answered before any build work: did the POM change, and is
    # there room in the org's monthly Maven Central budget?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.gate.outputs.needed == 'true' && steps.quota.outputs.available == 'true' }}
      last: ${{ steps.gate.outputs.last }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # needs-release reads tags and history
      - id: gate
        uses: metio/ci/needs-release@a221440cbc128a3736a2f950c8c8497d441384ed # 2026.7.26085035
        with:
          paths: pom.xml
      - id: quota
        if: steps.gate.outputs.needed == 'true'
        uses: metio/ci/central-quota@a221440cbc128a3736a2f950c8c8497d441384ed # 2026.7.26085035

  release:
    needs: [gate]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the notes read tags and history
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - id: version
        uses: metio/ci/calver@a221440cbc128a3736a2f950c8c8497d441384ed # 2026.7.26085035
      - name: Set release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --define newVersion="$VERSION"
          --define generateBackupPoms=false
          versions:set
      - name: Write signing key and Central credentials
        env:
          GPG_SECRET_KEY_BASE64: ${{ secrets.GPG_SECRET_KEY_BASE64 }}
        run: |
          echo "$GPG_SECRET_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.key.asc"
          # The POM publishes through server id "central"; the credentials are
          # read from the environment at deploy time so no secret is written to
          # the settings file itself.
          cat > "$RUNNER_TEMP/settings.xml" <<'XML'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          SIGN_KEY_PASS: ${{ secrets.GPG_SECRET_KEY_PASSWORD }}
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --settings "$RUNNER_TEMP/settings.xml"
          --activate-profiles release
          --define sign.keyFile="$RUNNER_TEMP/signing.key.asc"
          --define sign.keyPass="$SIGN_KEY_PASS"
          deploy
      - id: notes
        name: Generate release notes
        uses: metio/ci/release-notes@a221440cbc128a3736a2f950c8c8497d441384ed # 2026.7.26085035
        with:
          version: ${{ steps.version.outputs.version }}
          previous: ${{ needs.gate.outputs.last }}
      # The GitHub release is what central-quota counts, so it is created only
      # after the deploy succeeded — a failed publish must not consume budget.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --notes-file "$NOTES" --title "$VERSION"
