name: Verify
on:
  merge_group:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  maven:
    # Reusable Maven pipeline shared across the metio JVM repos. Named "Maven"
    # so its checks read "Maven / build", "Maven / javadoc". This POM has no
    # Java sources of its own, so the javadoc gate has nothing to render.
    name: Maven
    uses: metio/ci/.github/workflows/maven.yml@2c9b3ef3bf280e85541853d686e261dd7b92eac9 # 2026.11.2090039
    with:
      javadoc: false
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@2c9b3ef3bf280e85541853d686e261dd7b92eac9 # 2026.11.2090039
        with:
          registries: github:metio/toolchains
      - env:
          GH_TOKEN: ${{ github.token }}
        run: breto run ci-lint
  verify:
    # Single required check covering every job above: mark only this one
    # required in branch protection and new jobs are covered automatically.
    name: Verify
    needs: [maven, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
